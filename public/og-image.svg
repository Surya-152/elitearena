<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="100%" stop-color="#0d0d14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#ff2d78"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e1e30" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>

  <!-- Glow circles -->
  <ellipse cx="200" cy="200" rx="300" ry="200" fill="#00e5ff" opacity="0.04"/>
  <ellipse cx="1000" cy="430" rx="300" ry="200" fill="#ff2d78" opacity="0.04"/>

  <!-- Logo icon -->
  <rect x="80" y="80" width="64" height="64" rx="16" fill="url(#accent)"/>
  <text x="112" y="124" font-family="Arial" font-size="36" font-weight="900" fill="white" text-anchor="middle">⚡</text>

  <!-- Brand name -->
  <text x="164" y="120" font-family="Arial Black, Arial" font-size="40" font-weight="900" fill="white">Elite</text>
  <text x="284" y="120" font-family="Arial Black, Arial" font-size="40" font-weight="900" fill="#00e5ff">Arena</text>

  <!-- Main headline -->
  <text x="80" y="240" font-family="Arial Black, Arial" font-size="72" font-weight="900" fill="white">India's #1</text>
  <text x="80" y="330" font-family="Arial Black, Arial" font-size="72" font-weight="900" fill="url(#accent)">Esports Platform</text>

  <!-- Subtext -->
  <text x="80" y="400" font-family="Arial, sans-serif" font-size="32" fill="#c8c8e0">BGMI  •  Free Fire MAX  •  COD Mobile</text>

  <!-- Feature pills -->
  <rect x="80" y="450" width="200" height="48" rx="24" fill="#00e5ff" opacity="0.15"/>
  <rect x="80" y="450" width="200" height="48" rx="24" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="180" y="481" font-family="Arial" font-size="20" fill="#00e5ff" text-anchor="middle">Real Prizes</text>

  <rect x="300" y="450" width="230" height="48" rx="24" fill="#ff2d78" opacity="0.12"/>
  <rect x="300" y="450" width="230" height="48" rx="24" fill="none" stroke="#ff2d78" stroke-width="1.5"/>
  <text x="415" y="481" font-family="Arial" font-size="20" fill="#ff2d78" text-anchor="middle">UPI Withdrawal</text>

  <rect x="550" y="450" width="230" height="48" rx="24" fill="#ffd700" opacity="0.12"/>
  <rect x="550" y="450" width="230" height="48" rx="24" fill="none" stroke="#ffd700" stroke-width="1.5"/>
  <text x="665" y="481" font-family="Arial" font-size="20" fill="#ffd700" text-anchor="middle">Free to Join</text>

  <!-- Domain -->
  <text x="1120" y="590" font-family="Arial" font-size="24" fill="#4a4a6a" text-anchor="end">yourdomain.com</text>
</svg>
